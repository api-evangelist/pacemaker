aid: pacemaker
name: PaceMaker
description: PaceMaker is the consumer DJ application from Pacemaker Music AB, a Swedish startup and
  500 Global portfolio company, that lets anyone mix and mash millions of tracks on iPhone and iPad.
  It connects to streaming catalogs such as Spotify, includes an AI DJ that suggests matching tracks
  and beat-matched transitions, and lets users crop and blend songs at phrase, bar, and beat precision
  to record and share their own mixtapes. Pacemaker is a mobile end-user product; as of this pass it
  publishes no public developer API, OpenAPI definition, SDK, MCP server, or developer portal, and its
  domain (pacemaker.net) currently serves a WordPress marketing blog.
